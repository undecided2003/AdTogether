name: Publish SDKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- Web SDK (npm) ---
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
        working-directory: sdk/web-sdk
      - name: Build Web SDK
        run: npm run build
        working-directory: sdk/web-sdk
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --no-git-checks
        working-directory: sdk/web-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- React Native SDK (npm) ---
  publish-react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
        working-directory: sdk/react-native-sdk
      - name: Build React Native SDK
        run: npm run build
        working-directory: sdk/react-native-sdk
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --no-git-checks
        working-directory: sdk/react-native-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Android SDK (Maven Central) ---
  publish-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Import GPG key and prepare signing
        run: |
          # Import the ASCII-armored private key into GPG (handles newlines correctly)
          echo "${{ secrets.SIGNING_KEY }}" | gpg --batch --import
          
          # Export to a binary keyring file (avoids all newline/encoding issues)
          gpg --export-secret-keys ${{ secrets.SIGNING_KEY_ID }} > /tmp/secring.gpg
          
          # Verify the keyring was created and is non-empty
          echo "Keyring size: $(wc -c < /tmp/secring.gpg) bytes"
          
          # Write signing config to gradle.properties (file-based signing)
          echo "" >> sdk/android-sdk/gradle.properties
          echo "signing.keyId=${{ secrets.SIGNING_KEY_ID }}" >> sdk/android-sdk/gradle.properties
          echo "signing.password=${{ secrets.SIGNING_PASSWORD }}" >> sdk/android-sdk/gradle.properties
          echo "signing.secretKeyRingFile=/tmp/secring.gpg" >> sdk/android-sdk/gradle.properties

      - name: Publish GPG key to keyservers
        run: |
          gpg --keyserver hkps://keyserver.ubuntu.com --send-keys ${{ secrets.SIGNING_KEY_ID }} || true
          gpg --keyserver hkps://keys.openpgp.org --send-keys ${{ secrets.SIGNING_KEY_ID }} || true
          gpg --keyserver hkps://pgp.mit.edu --send-keys ${{ secrets.SIGNING_KEY_ID }} || true
          echo "Waiting 30 seconds for keyserver propagation..."
          sleep 30

      - name: Verify signing locally before publishing
        run: |
          # Quick sanity check: sign a test file and verify it
          echo "test" > /tmp/test.txt
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.SIGNING_PASSWORD }}" \
            --local-user ${{ secrets.SIGNING_KEY_ID }} --detach-sign /tmp/test.txt
          gpg --verify /tmp/test.txt.sig /tmp/test.txt
          echo "✅ GPG signing verification passed"

      - name: Publish to Maven Central
        run: |
          gradle publishToMavenCentral --no-configuration-cache \
            --stacktrace --info
        working-directory: sdk/android-sdk
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # --- Flutter SDK (pub.dev) ---
  publish-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: sdk/adtogether_sdk

      - name: Publish Flutter SDK
        run: |
          mkdir -p ~/.config/dart
          # Write credentials to multiple potential locations used by different versions
          printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
          printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.config/dart/credentials.json
          if [ -d "$PUB_CACHE" ]; then
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > "$PUB_CACHE/pub-credentials.json"
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > "$PUB_CACHE/credentials.json"
          else
            mkdir -p ~/.pub-cache
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.pub-cache/pub-credentials.json
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.pub-cache/credentials.json
          fi
          flutter pub publish --force
        working-directory: sdk/adtogether_sdk

  # --- iOS SDK (SPM) ---
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS SDK
        run: swift build
        working-directory: sdk/ios-sdk

