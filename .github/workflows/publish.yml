name: Publish SDKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- Web SDK (npm) ---
  publish-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
        working-directory: sdk/web-sdk
      - name: Build Web SDK
        run: npm run build
        working-directory: sdk/web-sdk
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --no-git-checks
        working-directory: sdk/web-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- React Native SDK (npm) ---
  publish-react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
        working-directory: sdk/react-native-sdk
      - name: Build React Native SDK
        run: npm run build
        working-directory: sdk/react-native-sdk
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --no-git-checks
        working-directory: sdk/react-native-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Android SDK (Maven Central) ---
  publish-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Import GPG key for keyserver upload
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | gpg --batch --import
          echo "GPG key imported. Key info:"
          gpg --list-keys --keyid-format long ${{ secrets.SIGNING_KEY_ID }}

      - name: Prepare in-memory signing key
        run: |
          # Extract the base64 key body (strip ASCII armor headers/footers)
          # This is what Gradle's in-memory signing expects
          SIGNING_KEY_BODY=$(echo "${{ secrets.SIGNING_KEY }}" | \
            grep -v '^-----' | \
            grep -v '^Version:' | \
            grep -v '^Comment:' | \
            grep -v '^Hash:' | \
            grep -v '^\s*$' | \
            tr -d '\n')
          
          # Verify we extracted something
          KEY_LENGTH=${#SIGNING_KEY_BODY}
          echo "Extracted in-memory key body: $KEY_LENGTH characters"
          if [ "$KEY_LENGTH" -lt 100 ]; then
            echo "❌ ERROR: Extracted key body is too short!"
            exit 1
          fi
          
          # Store for later steps (masked in logs)
          echo "::add-mask::$SIGNING_KEY_BODY"
          echo "SIGNING_KEY_BODY=$SIGNING_KEY_BODY" >> $GITHUB_ENV

      - name: Publish GPG key to keyservers
        run: |
          KEY_ID="${{ secrets.SIGNING_KEY_ID }}"
          echo "Publishing key $KEY_ID to keyservers..."
          
          for SERVER in "hkps://keyserver.ubuntu.com" "hkps://keys.openpgp.org"; do
            echo "→ Uploading to $SERVER"
            for ATTEMPT in 1 2 3; do
              if timeout 30 gpg --keyserver "$SERVER" --send-keys "$KEY_ID" 2>&1; then
                echo "  ✅ Uploaded to $SERVER (attempt $ATTEMPT)"
                break
              else
                echo "  ⚠️ Attempt $ATTEMPT failed for $SERVER"
                sleep 5
              fi
            done
          done

      - name: Wait for keyserver propagation
        run: |
          echo "Waiting 120 seconds for keyserver propagation..."
          sleep 120

      - name: Verify key is retrievable from keyservers
        run: |
          KEY_ID="${{ secrets.SIGNING_KEY_ID }}"
          KEY_FOUND=false
          for SERVER in "hkps://keyserver.ubuntu.com" "hkps://keys.openpgp.org"; do
            echo "→ Checking $SERVER for key $KEY_ID..."
            if timeout 30 gpg --batch --keyserver "$SERVER" --recv-keys "$KEY_ID" 2>&1; then
              echo "  ✅ Key successfully retrieved from $SERVER"
              KEY_FOUND=true
              break
            else
              echo "  ❌ Key NOT found on $SERVER"
            fi
          done
          if [ "$KEY_FOUND" = false ]; then
            echo "❌ FATAL: Key $KEY_ID is not retrievable from ANY keyserver!"
            echo "Maven Central will reject signatures. Aborting."
            exit 1
          fi

      - name: Build, sign, and stage artifacts locally
        run: |
          gradle publishAllPublicationsToStagingLocalRepository --no-configuration-cache \
            --no-daemon --stacktrace
        working-directory: sdk/android-sdk
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.SIGNING_KEY_BODY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Verify .asc signatures against artifacts
        run: |
          echo "=== Verifying all .asc signatures in staging repo ==="
          STAGING_DIR="sdk/android-sdk/build/stagingLocalRepository"
          FAIL=false
          
          find "$STAGING_DIR" -name "*.asc" | while read ASC_FILE; do
            ARTIFACT_FILE="${ASC_FILE%.asc}"
            if [ -f "$ARTIFACT_FILE" ]; then
              echo "→ Verifying: $(basename "$ARTIFACT_FILE")"
              if gpg --verify "$ASC_FILE" "$ARTIFACT_FILE" 2>&1; then
                echo "  ✅ Signature valid"
              else
                echo "  ❌ SIGNATURE INVALID: $ASC_FILE"
                echo "FAIL=true" >> $GITHUB_ENV
              fi
            else
              echo "  ⚠️ No matching artifact for $ASC_FILE"
            fi
          done
          
          if [ "${FAIL}" = "true" ]; then
            echo "❌ FATAL: One or more signatures failed verification!"
            exit 1
          fi
          
          echo ""
          echo "=== Listing all staged artifacts ==="
          find "$STAGING_DIR" -type f | sort

      - name: Publish to Maven Central
        run: |
          gradle publishAllPublicationsToMavenCentralRepository --no-configuration-cache \
            --no-daemon --stacktrace --info
        working-directory: sdk/android-sdk
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.SIGNING_KEY_BODY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # --- Flutter SDK (pub.dev) ---
  publish-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: sdk/adtogether_sdk

      - name: Publish Flutter SDK
        run: |
          mkdir -p ~/.config/dart
          # Write credentials to multiple potential locations used by different versions
          printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
          printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.config/dart/credentials.json
          if [ -d "$PUB_CACHE" ]; then
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > "$PUB_CACHE/pub-credentials.json"
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > "$PUB_CACHE/credentials.json"
          else
            mkdir -p ~/.pub-cache
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.pub-cache/pub-credentials.json
            printf '%s' '${{ secrets.PUB_DEV_CREDENTIALS }}' > ~/.pub-cache/credentials.json
          fi
          flutter pub publish --force
        working-directory: sdk/adtogether_sdk

  # --- iOS SDK (SPM) ---
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS SDK
        run: swift build
        working-directory: sdk/ios-sdk

