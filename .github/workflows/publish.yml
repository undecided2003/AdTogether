name: Publish SDKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Never let two releases publish over each other.
concurrency:
  group: publish-sdks-${{ github.ref }}
  cancel-in-progress: false

# Needed by the iOS job to push the bare semver tag (SwiftPM cannot resolve `v0.5.6`).
permissions:
  contents: write

jobs:
  # Keep every registry artifact tied to the same immutable source tag. Without
  # this gate, dispatching the workflow from a branch (or tagging an older
  # commit) could publish the current package files under an unrelated tag.
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag and SDK version parity
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" != "tag" ] || [[ ! "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Run this publishing workflow from a v<semver> tag (for example v0.5.6)."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          WEB_VERSION="$(node -p "require('./sdk/web-sdk/package.json').version")"
          REACT_NATIVE_VERSION="$(node -p "require('./sdk/react-native-sdk/package.json').version")"
          FLUTTER_VERSION="$(sed -n 's/^version: *//p' sdk/adtogether_sdk/pubspec.yaml | head -1 | tr -d '[:space:]')"
          ANDROID_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/android-sdk/build.gradle.kts | head -1)"
          IOS_VERSION="$(sed -n 's/.*spec\.version *= *"\([^"]*\)".*/\1/p' sdk/ios-sdk/AdTogether.podspec | head -1)"

          for ENTRY in \
            "@adtogether/web-sdk:$WEB_VERSION" \
            "@adtogether/react-native-sdk:$REACT_NATIVE_VERSION" \
            "adtogether_sdk:$FLUTTER_VERSION" \
            "adtogether-sdk:$ANDROID_VERSION" \
            "AdTogether:$IOS_VERSION"; do
            NAME="${ENTRY%%:*}"
            PACKAGE_VERSION="${ENTRY#*:}"
            if [ -z "$PACKAGE_VERSION" ] || [ "$PACKAGE_VERSION" != "$VERSION" ]; then
              echo "::error::$NAME declares '$PACKAGE_VERSION', but the release tag is '$GITHUB_REF_NAME'."
              exit 1
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # --- Web SDK (npm) ---
  publish-web:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
        working-directory: sdk/web-sdk
      - name: Build Web SDK
        run: npm run build
        working-directory: sdk/web-sdk
      - name: Publish to npm
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # Re-running a workflow must not fail just because the version already exists.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already published on npm — nothing to do."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --no-git-checks
        working-directory: sdk/web-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- React Native SDK (npm) ---
  publish-react-native:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
        working-directory: sdk/react-native-sdk
      - name: Build React Native SDK
        run: npm run build
        working-directory: sdk/react-native-sdk
      - name: Publish to npm
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # Re-running a workflow must not fail just because the version already exists.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already published on npm — nothing to do."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --no-git-checks
        working-directory: sdk/react-native-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Android SDK (Maven Central) ---
  publish-android:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Makes the job safe to re-run: a version that is already on Maven Central cannot be
      # uploaded twice (Sonatype rejects duplicate deployments), so repeat runs only verify.
      - name: Resolve version and check Maven Central
        id: release-state
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -1)"
          METADATA="https://repo1.maven.org/maven2/com/relaxsoftwareapps/adtogether/adtogether-sdk/maven-metadata.xml"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS "$METADATA" | grep -q "<version>${VERSION}</version>"; then
            echo "::notice::com.relaxsoftwareapps.adtogether:adtogether-sdk:$VERSION is already on Maven Central — skipping the upload steps and verifying only."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: sdk/android-sdk

      - name: Set up JDK 17
        if: steps.release-state.outputs.already_published != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        if: steps.release-state.outputs.already_published != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Import GPG key for keyserver upload
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | gpg --batch --import
          echo "GPG key imported. Key info:"
          gpg --list-keys --keyid-format long ${{ secrets.SIGNING_KEY_ID }}

      # --- Removed manual stripping of GPG armor to prevent corruption ---

      - name: Publish GPG key to keyservers
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          KEY_ID="${{ secrets.SIGNING_KEY_ID }}"
          echo "Publishing key $KEY_ID to keyservers..."
          
          for SERVER in "hkps://keyserver.ubuntu.com" "hkps://keys.openpgp.org"; do
            echo "→ Uploading to $SERVER"
            for ATTEMPT in 1 2 3; do
              if timeout 30 gpg --keyserver "$SERVER" --send-keys "$KEY_ID" 2>&1; then
                echo "  ✅ Uploaded to $SERVER (attempt $ATTEMPT)"
                break
              else
                echo "  ⚠️ Attempt $ATTEMPT failed for $SERVER"
                sleep 5
              fi
            done
          done

      - name: Wait for keyserver propagation
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          echo "Waiting 120 seconds for keyserver propagation..."
          sleep 120

      - name: Verify key is retrievable from keyservers
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          KEY_ID="${{ secrets.SIGNING_KEY_ID }}"
          KEY_FOUND=false
          for SERVER in "hkps://keyserver.ubuntu.com" "hkps://keys.openpgp.org"; do
            echo "→ Checking $SERVER for key $KEY_ID..."
            if timeout 30 gpg --batch --keyserver "$SERVER" --recv-keys "$KEY_ID" 2>&1; then
              echo "  ✅ Key successfully retrieved from $SERVER"
              KEY_FOUND=true
              break
            else
              echo "  ❌ Key NOT found on $SERVER"
            fi
          done
          if [ "$KEY_FOUND" = false ]; then
            echo "❌ FATAL: Key $KEY_ID is not retrievable from ANY keyserver!"
            echo "Maven Central will reject signatures. Aborting."
            exit 1
          fi

      - name: Build, sign, and stage artifacts locally
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          gradle publishAllPublicationsToStagingLocalRepository --no-configuration-cache \
            --no-daemon --stacktrace
        working-directory: sdk/android-sdk
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Verify .asc signatures against artifacts
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "=== Verifying all .asc signatures in staging repo ==="
          STAGING_DIR="sdk/android-sdk/build/stagingLocalRepository"
          FAIL=false
          SIGNATURE_COUNT=0

          while IFS= read -r -d '' ASC_FILE; do
            SIGNATURE_COUNT=$((SIGNATURE_COUNT + 1))
            ARTIFACT_FILE="${ASC_FILE%.asc}"
            if [ -f "$ARTIFACT_FILE" ]; then
              echo "→ Verifying: $(basename "$ARTIFACT_FILE")"
              if gpg --verify "$ASC_FILE" "$ARTIFACT_FILE" 2>&1; then
                echo "  ✅ Signature valid"
              else
                echo "  ❌ SIGNATURE INVALID: $ASC_FILE"
                FAIL=true
              fi
            else
              echo "  ❌ No matching artifact for $ASC_FILE"
              FAIL=true
            fi
          done < <(find "$STAGING_DIR" -type f -name "*.asc" -print0)

          if [ "$SIGNATURE_COUNT" -eq 0 ]; then
            echo "❌ FATAL: No staged signatures were found!"
            exit 1
          fi

          if [ "${FAIL}" = "true" ]; then
            echo "❌ FATAL: One or more signatures failed verification!"
            exit 1
          fi
          
          echo ""
          echo "=== Listing all staged artifacts ==="
          find "$STAGING_DIR" -type f | sort

      - name: Publish to Maven Central
        if: steps.release-state.outputs.already_published != 'true'
        run: |
          gradle publishAllPublicationsToMavenCentralRepository --no-configuration-cache \
            --no-daemon --stacktrace --info
        working-directory: sdk/android-sdk
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      # An upload alone does not reach Maven Central: the Sonatype Central Portal deployment
      # must also be released. `publishToMavenCentral(..., automaticRelease = true)` in
      # build.gradle.kts takes care of that, and this step proves the artifact is downloadable.
      - name: Verify release is live on Maven Central
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -1)"
          echo "Expecting com.relaxsoftwareapps.adtogether:adtogether-sdk:$VERSION on Maven Central..."
          METADATA="https://repo1.maven.org/maven2/com/relaxsoftwareapps/adtogether/adtogether-sdk/maven-metadata.xml"
          for ATTEMPT in $(seq 1 30); do
            if curl -fsS "$METADATA" | grep -q "<version>${VERSION}</version>"; then
              echo "✅ sdk:$VERSION is live on Maven Central (attempt $ATTEMPT)"
              exit 0
            fi
            echo "⏳ sdk:$VERSION not visible yet (attempt $ATTEMPT/30) — Maven Central indexing can take 10-30 minutes..."
            sleep 60
          done
          echo "❌ sdk:$VERSION was not found in $METADATA after 30 minutes."
          echo "Check Sonatype Central Portal → Deployments: the upload may be stuck as VALIDATED (unpublished)."
          exit 1
        working-directory: sdk/android-sdk

  # --- Flutter SDK (pub.dev) ---
  publish-flutter:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Primary auth: the PUB_DEV_CREDENTIALS secret (pub.dev OAuth2 credentials JSON),
    # restored to the Dart config dir below. Fallback: pub.dev GitHub Actions OIDC
    # automated publishing (configured in the package admin as repo
    # `undecided2003/AdTogether`, workflow file `publish.yml`).
    permissions:
      id-token: write
    env:
      PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore pub.dev credentials
        # Without this file the pub client falls back to the interactive Google
        # OAuth browser flow, which hangs forever on CI (the v0.5.3 run burned
        # the full 6h job timeout waiting for authorization).
        run: |
          if [ -z "$PUB_DEV_CREDENTIALS" ]; then
            echo "::warning::PUB_DEV_CREDENTIALS is not set — relying on pub.dev OIDC automated publishing."
            exit 0
          fi
          mkdir -p "$HOME/.config/dart"
          printenv PUB_DEV_CREDENTIALS > "$HOME/.config/dart/pub-credentials.json"
          echo "pub.dev credentials restored to ~/.config/dart/pub-credentials.json"
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: sdk/adtogether_sdk

      - name: Publish Flutter SDK
        run: |
          set -uo pipefail
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr -d '[:space:]')"
          API="https://pub.dev/api/packages/adtogether_sdk"
          echo "Resolved adtogether_sdk version: $VERSION"

          version_is_live() {
            curl -fsS "$API" | grep -qE "\"version\": *\"$VERSION\""
          }

          if version_is_live; then
            echo "::notice::adtogether_sdk $VERSION is already published on pub.dev — nothing to do."
            exit 0
          fi

          # `flutter pub publish` has been observed to hang on CI runners *after* a
          # successful upload (the v0.5.3 run burned the default 6h job timeout). Bound it
          # with `timeout` and use the pub.dev API — not the exit code — as the source of truth.
          set +e
          timeout 600 flutter pub publish --force
          PUBLISH_EXIT=$?
          set -e
          echo "flutter pub publish exited with code $PUBLISH_EXIT"

          for ATTEMPT in $(seq 1 30); do
            if version_is_live; then
              echo "✅ adtogether_sdk $VERSION is live on pub.dev (verified on attempt $ATTEMPT)"
              exit 0
            fi
            echo "⏳ adtogether_sdk $VERSION not visible on pub.dev yet (attempt $ATTEMPT/30)..."
            sleep 20
          done

          echo "❌ Could not verify adtogether_sdk $VERSION on pub.dev (publish exit code: $PUBLISH_EXIT)"
          exit 1
        working-directory: sdk/adtogether_sdk

  # --- iOS SDK (SPM / CocoaPods) ---
  build-ios:
    needs: validate-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # `git subtree split` needs the full history of sdk/ios-sdk.
          fetch-depth: 0
          # The mirror push below authenticates with the SDK_SYNC_TOKEN PAT
          # embedded in the remote URL. With persist-credentials, actions/checkout
          # persists GITHUB_TOKEN as an http.extraheader (global config include)
          # that overrides URL credentials on every github.com request, so the push
          # to adtogether-ios-sdk authenticates as github-actions[bot] and gets 403.
          # Disable persistence; each push below supplies its own token instead.
          persist-credentials: false

      - name: Build iOS SDK
        run: swift build
        working-directory: sdk/ios-sdk

      # Swift Package Manager only resolves *bare* semantic version tags, so `v0.5.6`
      # (pushed by release.yml) is invisible to it — a bare semver tag is required for the
      # `.package(url: ".../AdTogether.git", from: "0.5.6")` instructions we publish.
      - name: Tag this repository with the bare semver version for SwiftPM
        env:
          # persist-credentials is false, so supply the push token explicitly.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*spec\.version *= *"\([^"]*\)".*/\1/p' sdk/ios-sdk/AdTogether.podspec | head -1)"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "Resolved iOS SDK version: $VERSION"

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            git fetch --depth=1 origin "refs/tags/$VERSION"
            EXISTING_COMMIT="$(git rev-list -n 1 FETCH_HEAD)"
            if [ "$EXISTING_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "::error::SwiftPM tag $VERSION already points to $EXISTING_COMMIT, not this release commit $RELEASE_COMMIT."
              exit 1
            fi
            echo "::notice::Tag $VERSION already points to this release commit — nothing to do."
            exit 0
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RELEASE_COMMIT:refs/tags/$VERSION"
          echo "✅ Tagged ${RELEASE_COMMIT:0:7} as $VERSION for Swift Package Manager"

      # The root repository's bare tag serves Swift Package Manager. CocoaPods resolves
      # the standalone adtogether-ios-sdk source repository, so mirror and tag it here
      # before publishing the podspec.
      # Requires a `SDK_SYNC_TOKEN` secret (fine-grained PAT with contents:write on
      # undecided2003/adtogether-ios-sdk). Without it the release fails.
      - name: Mirror sources and tag the release in adtogether-ios-sdk
        env:
          SDK_SYNC_TOKEN: ${{ secrets.SDK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*spec\.version *= *"\([^"]*\)".*/\1/p' sdk/ios-sdk/AdTogether.podspec | head -1)"
          echo "Resolved iOS SDK version: $VERSION"

          if [ -z "${SDK_SYNC_TOKEN:-}" ]; then
            echo "::error::SDK_SYNC_TOKEN is required to publish the iOS source mirror used by CocoaPods."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add ios-sdk "https://x-access-token:${SDK_SYNC_TOKEN}@github.com/undecided2003/adtogether-ios-sdk.git"

          SPLIT="$(git subtree split --prefix=sdk/ios-sdk)"
          echo "Subtree split commit: $SPLIT"
          SPLIT_TREE="$(git rev-parse "${SPLIT}^{tree}")"

          # The split chain's commit SHAs depend on the committer identity of the
          # run (bot here, the original author for older mirrored pushes), so a
          # fast-forward against the mirror's existing main can never be assumed.
          # This repo is a generated mirror of sdk/ios-sdk — compare content
          # instead: identical tree means nothing to do, otherwise force-update.
          git fetch ios-sdk main
          REMOTE_TREE="$(git rev-parse "FETCH_HEAD^{tree}")"
          if [ "$REMOTE_TREE" = "$SPLIT_TREE" ]; then
            echo "::notice::adtogether-ios-sdk main already mirrors this release's content — nothing to do."
          else
            git push --force ios-sdk "$SPLIT:refs/heads/main"
            echo "✅ Force-pushed sdk/ios-sdk to adtogether-ios-sdk main (mirror, content $SPLIT_TREE)"
          fi

          if git ls-remote --tags ios-sdk "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            git fetch --depth=1 ios-sdk "refs/tags/$VERSION"
            EXISTING_TREE="$(git rev-parse "FETCH_HEAD^{tree}")"
            if [ "$EXISTING_TREE" != "$SPLIT_TREE" ]; then
              echo "::error::iOS mirror tag $VERSION points at content $EXISTING_TREE, not this release's $SPLIT_TREE."
              exit 1
            fi
            echo "::notice::Tag $VERSION already points to this release's content — nothing to do."
          else
            git push ios-sdk "$SPLIT:refs/tags/$VERSION"
            echo "✅ Tagged adtogether-ios-sdk with $VERSION"
          fi

      # A tagged source repository is not a CocoaPods release. Trunk validates
      # the podspec and publishes it to the public Specs service for `pod
      # 'AdTogether'` consumers. The token is a verified Trunk session token.
      - name: Publish iOS SDK to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*spec\.version *= *"\([^"]*\)".*/\1/p' sdk/ios-sdk/AdTogether.podspec | head -1)"
          if [ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]; then
            # Match the SDK_SYNC_TOKEN convention: a missing optional secret skips
            # instead of blocking the release. SwiftPM consumers are already served
            # by the bare tag pushed above.
            echo "::warning::COCOAPODS_TRUNK_TOKEN is not configured — skipping the CocoaPods push. Run 'pod trunk register' and add the secret to publish AdTogether $VERSION."
            exit 0
          fi

          if pod trunk info AdTogether 2>/dev/null | awk -v version="$VERSION" '$1 == "-" && $2 == version { found = 1 } END { exit !found }'; then
            echo "::notice::AdTogether $VERSION is already published to CocoaPods — nothing to do."
            exit 0
          fi

          pod trunk push sdk/ios-sdk/AdTogether.podspec

